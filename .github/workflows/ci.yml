name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Run on demand against a branch. Needed because a Dependabot pull request that auto-merges
  # leaves main's tip with no run of its own: the merge is made with GITHUB_TOKEN, and GitHub
  # starts no workflow for a push made with that token. The pull request's own checks ran
  # against a different SHA — a squash merge creates a commit nothing has built. This is how
  # that commit gets tested, and `scripts/cut-release.sh` offers it when a tag would otherwise
  # land on something unverified.
  workflow_dispatch:

# The UI default (Settings -> Actions -> General -> Workflow permissions) is a
# fallback; declaring it here keeps this workflow correct regardless of it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvet
          POSTGRES_PASSWORD: kvet
          POSTGRES_DB: kvet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kvet -d kvet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kvet:kvet@localhost:5432/kvet
    defaults:
      run:
        working-directory: k-vet-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: k-vet-backend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - run: cargo fmt --check
      - name: Migrate (offline metadata must match the schema)
        run: cargo sqlx migrate run
      - run: cargo sqlx prepare --check -- --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k-vet-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: k-vet-web/package-lock.json
      - run: npm ci
      - run: npx biome ci
      - run: npx knip
      - run: npx tsc --noEmit
      - run: npm test
      - name: OpenAPI / client codegen drift
        working-directory: .
        run: ./scripts/check-codegen-drift.sh

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvet
          POSTGRES_PASSWORD: kvet
          POSTGRES_DB: kvet_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kvet -d kvet_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kvet:kvet@localhost:5432/kvet_e2e
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: k-vet-backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: k-vet-web/package-lock.json
      - name: Build frontend
        working-directory: k-vet-web
        run: |
          npm ci
          npm run build
      - name: Build backend
        working-directory: k-vet-backend
        run: cargo build
      - name: Install poppler-utils
        # The settings spec reads the invoice PDF with pdftotext.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E (desktop + pixel-9a)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
          retention-days: 7

  # Known advisories against the dependency tree. This is the gate that gives
  # auto-merged Dependabot pull requests a meaning beyond "the tests still pass":
  # a bump into a version with a published advisory fails here and stops the merge.
  #
  # What ships is gated; what only ever runs in CI is reported. A DoS advisory in
  # a bundler cannot reach the practice, and blocking every merge on one would only
  # teach us to ignore the job.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # cache-bin (on by default) keeps cargo-audit itself out of the critical
      # path after the first run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: k-vet-backend
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust advisories
        working-directory: k-vet-backend
        # Tolerated advisories, each with its reason, live in
        # k-vet-backend/.cargo/audit.toml. Revisit that list when typst moves.
        run: cargo audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
      - name: Frontend advisories (what reaches the browser)
        working-directory: k-vet-web
        run: npm audit --omit=dev --audit-level=high
      - name: Build-tooling advisories (reported, not gated)
        working-directory: k-vet-web
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: E2E tooling advisories (reported, not gated)
        working-directory: e2e
        continue-on-error: true
        run: npm audit --audit-level=high

  # The release image is built on the Pi itself (docs/installation.md) and never pushed to a
  # registry. This job only proves the Dockerfile still builds, so a broken image is not
  # discovered on the appliance.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built the way a release is, so the build argument is exercised rather than assumed.
      - run: docker build --build-arg KVET_VERSION=ci -t k-vet:ci .
      - name: The image knows which build it is
        run: |
          version="$(docker run --rm --entrypoint printenv k-vet:ci KVET_VERSION)"
          if [ "$version" != "ci" ]; then
            echo "expected KVET_VERSION=ci in the image, got '$version'" >&2
            exit 1
          fi
      - name: The entrypoint refuses to start without a configuration
        run: |
          if docker run --rm k-vet:ci; then
            echo "expected a non-zero exit without /etc/k-vet/config.toml" >&2
            exit 1
          fi

  # The record of what a tag contains. `git log <last deployed tag>..main` is how anyone works
  # out what the practice has not seen yet — SECURITY.md and the Dependabot auto-merge workflow
  # both already say to read exactly that, and until this repository had tags, neither could.
  #
  # It runs behind `image`, so a release that exists is a release whose every gate passed on the
  # tagged commit. Nothing is uploaded: the artefact is still built on the Pi.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Generating notes means diffing against the previous tag, which needs the history.
          fetch-depth: 0
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Whether this release can be rolled back by restarting the previous image, or needs a
          # restore first. Migrations are forward-only and run at start, so this is the single
          # most useful line in the notes for whoever is standing at the Pi.
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            migrations="$(git diff --name-only "$previous..$TAG" -- k-vet-backend/migrations/)"
          else
            migrations="$(git ls-files k-vet-backend/migrations/)"
          fi

          if [ -n "$migrations" ]; then
            header="**Contains migrations.** Rolling back needs a restore, not just the previous"
            header="$header image — take the dump before promoting (\`deploy/promote.sh\` does)."
            header="$header"$'\n'
            header="$header$(echo "$migrations" | sed 's|k-vet-backend/migrations/|- |')"
          else
            header="No migrations. Rollback is an edit to \`KVET_VERSION\` and a restart."
          fi

          generated="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)"

          printf '%s\n\n%s\n' "$header" "$generated" \
            | gh release create "$TAG" --title "$TAG" --notes-file -
