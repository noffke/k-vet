# Dependabot keeps the pinned versions moving.
#
# Every dependency here is pinned exactly — full semver in `Cargo.toml` and `package.json`
# (Constitution I), exact tags in the `Dockerfile` — so a new version is always a commit. These
# are the pull requests that make it, and CI's gates (clippy, tests, codegen drift, Playwright)
# decide whether one is safe to merge.
#
# Patch and minor updates are grouped per ecosystem to keep the queue short for a single
# maintainer. Majors arrive as their own pull request, because they usually need a code change.
#
# Patch and minor pull requests merge themselves once CI is green (see
# .github/workflows/dependabot-auto-merge.yml), which is why every ecosystem carries a `cooldown`:
# a release has to age before Dependabot will propose it, and a compromised or simply broken
# version is usually yanked within hours. Dependabot applies 3 days by default even with no
# `cooldown` block; these lengthen it. Cargo and npm are semver ecosystems, so they can grade the
# wait by bump size; Actions tags and Docker tags are not, so those get a flat `default-days`.
#
# Two pins Dependabot cannot see, so bump them by hand:
#   * `cargo install sqlx-cli --version 0.9.0` in .github/workflows/ci.yml — keep it equal to the
#     `sqlx` version in k-vet-backend/Cargo.toml, or `cargo sqlx prepare --check` drifts.
#   * the Node version in the `setup-node` steps — keep it in step with the `node:` tag in the
#     Dockerfile and the `engines` field in k-vet-web/package.json.
version: 2

updates:
  # ── Backend crates ─────────────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/k-vet-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 30
    commit-message:
      prefix: "cargo"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Frontend packages ──────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/k-vet-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 30
    # The pins stay exact; only the pinned number moves.
    versioning-strategy: "increase"
    commit-message:
      prefix: "web"
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── End-to-end suite ───────────────────────────────────────────────────────────────────
  # Kept separate from the frontend: a Playwright bump also changes which browsers CI downloads.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 30
    versioning-strategy: "increase"
    commit-message:
      prefix: "e2e"
    groups:
      e2e-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Workflow actions ───────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ── Container base images (Dockerfile: node, rust, ubuntu) ──────────────────────────────
  # `ubuntu:noble` is a codename, so it stays put until the release is changed deliberately.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    commit-message:
      prefix: "docker"

  # ── Images referenced by the compose file (postgres) ───────────────────────────────────
  # Only `docker-compose.yml` is left, and it is the *development* database — deployment does
  # not use Compose. Keep its `postgres:` tag in step with the server running on the Pi, which
  # Dependabot cannot see at all.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    commit-message:
      prefix: "docker"
    ignore:
      # Held at 16 for now. A major Postgres release will not start on the previous release's
      # data directory, so the bump is not a bump: it is a pg_upgrade, done by hand on the Pi
      # with a backup in reach. Lift this when that has been scheduled.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
