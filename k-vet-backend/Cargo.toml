[package]
name = "k-vet-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = { version = "0.5.3", features = ["std", "password-hash", "rand"] }
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
# The phone's calendar (src/dav): the Basic login, its time zones, its events, its requests.
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
email_address = "0.2.9"
fast_qr = { version = "0.14.0", default-features = false, features = ["svg"] }
futures = "0.3.33"
hex = "0.4.3"
http-body-util = "0.1.5"
# Google Maps only (src/maps): the client half of the hyper that axum already serves with, and
# the TLS stack lettre and sqlx already use — rustls on ring with the bundled Mozilla roots.
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
icalendar = "0.17.17"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "pool"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mime_guess = "2.0.5"
minijinja = "2.21.0"
phonenumber = "0.3.10"
roxmltree = "0.20.0"
rust_iso3166 = "0.2.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = { version = "1.42.1", features = ["serde-str", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "chrono", "json", "rust_decimal"] }
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "io-util"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "limit", "compression-gzip"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
typst = "0.15.1"
typst-as-lib = { version = "0.17.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "decimal", "preserve_order"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Constitution I: clippy warnings are denied, `unwrap`/`expect` are forbidden in library code
# (allowed in tests via clippy.toml).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
